{% extends 'home.html' %}

    {% block content %}

    <div style="color: #ffff; font-size: 17pt; margin: 25px;"> 
      <p id="noFiles" style="display: none">I am sad because there are no files....</p> 
    
      <div id="files">
      
        {% for file in files %}
        <div style="margin-bottom: 15px;">
            <div style="display: inline-block;">{{loop.index}}</div>
            <div style="display: inline-block; margin-right: 13px;">{{file.get("filename")}}</div>
            <button style="display: inline-block; margin-right: 13px; font-size: inherit;" id="{{file.get('filename')}}" onclick="fetchFile(this.id)">download</button>
            <div style="display: inline-block; margin-right: 13px;">Uploaded: {{file.get("timestamp")}}</div>
            <button style="font-size: inherit;" id="{{file.get('filename')}}" onclick="deleteItem(this.id)">delete</button>
        </div>
        <hr style="width: 100%;">    
         {% endfor %}
    </div>
    </div>

    <script src="/static/js/viewUploadFiles.js"></script>

    {% endblock %}
